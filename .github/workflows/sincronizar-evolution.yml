# Busca as mudanças novas da Evolution Go oficial todo dia (ou pelo botão "Run workflow") e abre um
# Pull Request só com o que mudou. Com conflito, o PR vem marcado para revisão.
name: Sincronizar com a Evolution Go

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ou tag oficial (vazio = último código)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trazer as mudanças
        id: sync
        run: |
          git config user.name "API WhatsApp BOB"
          git config user.email "actions@users.noreply.github.com"
          set +e
          out="$(bash scripts/sincronizar-evolution.sh "${{ github.event.inputs.ref }}")"; code=$?
          set -e
          echo "$out"
          echo "resultado=$(echo "$out" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "para=$(echo "$out" | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          [[ $code -eq 0 || $code -eq 2 ]]
      - name: Abrir o Pull Request
        if: steps.sync.outputs.resultado != 'nada-novo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ramo="sincronizar/evolution-${{ steps.sync.outputs.para }}"
          git checkout -b "$ramo"
          git add -A
          git commit -qm "Sincroniza com a Evolution Go ${{ steps.sync.outputs.para }}" || exit 0
          git push -f origin "$ramo"
          corpo="Mudanças da Evolution Go oficial desde a última sincronização (arquivo UPSTREAM).

          $(cat .sincronizacao-commits.txt 2>/dev/null)

          Resultado: ${{ steps.sync.outputs.resultado }}. Se houver conflito, os arquivos vêm marcados com <<<<<<< para revisão."
          gh pr create --base main --head "$ramo" --title "Sincroniza com a Evolution Go ${{ steps.sync.outputs.para }}" --body "$corpo" || true
