name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilação e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Dependências do sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebp-dev libjpeg-turbo8-dev
      - name: Sem conflitos pendentes
        run: "! grep -rIl --exclude-dir=.git '^<<<<<<< ' ."
      - name: Compilar
        run: CGO_ENABLED=1 go build -o /tmp/bob ./cmd/evolution-go
      - name: Testes da BOB
        run: go test ./pkg/sendMessage/service/ ./pkg/routes/ -run Bob -count=1
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
