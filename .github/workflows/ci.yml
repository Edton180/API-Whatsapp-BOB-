name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilação e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Dependências do sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebp-dev ffmpeg
      - name: Formatação
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - name: OpenAPI atualizada
        run: python3 scripts/gerar-openapi.py && git diff --exit-code internal/panel/openapi.yaml internal/panel/openapi.json
      - name: Verificação
        run: go vet ./...
      - name: Compilar
        run: CGO_ENABLED=1 go build -o /tmp/bob ./cmd/bob
      - name: Testes
        run: go test -race -count=1 ./...
      - name: Sobe a API e confere as rotas
        run: |
          GLOBAL_API_KEY=ci SERVER_PORT=8099 DATA_DIR=/tmp/bobdata /tmp/bob &
          for i in $(seq 1 30); do curl -sf localhost:8099/server/ok && break; sleep 1; done
          curl -sf localhost:8099/painel/ >/dev/null
          curl -sf -H 'apikey: ci' -X POST localhost:8099/instance/create -d '{"name":"ci"}' | grep -q '"name":"ci"'
          curl -sf -H 'apikey: ci' localhost:8099/instance/all | grep -q '"ci"'
          curl -sf localhost:8099/license/status | grep -q active
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
